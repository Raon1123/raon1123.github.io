version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    # One PR per week for minor/patch bumps; majors stay separate for review.
    groups:
      ruby-minor-patch:
        update-types: [minor, patch]
    # Sass 2.0 drops the deprecated syntax the TeXt theme SCSS still uses (#117).
    # Block major bumps until the SCSS is migrated.
    ignore:
      - dependency-name: sass-embedded
        update-types: ["version-update:semver-major"]
      - dependency-name: jekyll-sass-converter
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
